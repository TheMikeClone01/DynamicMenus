<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Survival Infinito</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <h1>Voxel Survival</h1>
      <p><strong>Controles:</strong> WASD mover · Espacio saltar · Click izq romper · Click der colocar · 1/2 seleccionar bloque</p>
      <div class="bars">
        <div>Vida <span id="health">100</span></div>
        <div>Hambre <span id="hunger">100</span></div>
        <div>Día <span id="day">1</span></div>
        <div>Bloque: <span id="selected">Tierra</span></div>
      </div>
      <p id="status">Haz click para capturar el mouse y comenzar.</p>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="game.js"></script>
  </body>
</html>
